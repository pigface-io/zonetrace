[package]
name = "zonetrace"
description = "Zones timed into a call tree: a polite, low-overhead Rust profiler that subtracts its own cost. 4 to 27 ns a zone by machine, no dependencies, kernel counts per zone on Linux, and perf samples joined to zones."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pigface-io/zonetrace"
documentation = "https://docs.rs/zonetrace"
readme = "README.md"
keywords = ["profiler", "tracing", "instrumentation", "performance", "perf"]
categories = ["development-tools::profiling"]
exclude = [".github/", "prek.toml", "justfile"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
# One module reads the CPU counter; it allows unsafe code, and says why.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
needless_pass_by_value = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
manual_let_else = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
large_types_passed_by_value = "deny"
ref_option = "deny"
format_push_string = "deny"
unreadable_literal = "deny"
cloned_instead_of_copied = "deny"
explicit_iter_loop = "deny"
uninlined_format_args = "deny"

[features]
# A thread's zones in time, for joining with `perf` samples: the module
# timeline and the tool zonetrace-join.
timeline = []

[[bin]]
name = "zonetrace-join"
required-features = ["timeline"]

[[example]]
name = "perf_join"
required-features = ["timeline"]

[[test]]
name = "join"
required-features = ["timeline"]

[[bench]]
name = "overhead"
harness = false

[profile.release]
debug = "line-tables-only"
